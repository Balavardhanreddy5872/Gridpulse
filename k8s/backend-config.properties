# Plain, non-secret backend settings, turned into the ConfigMap the backend
# pods read (envFrom) by kustomize's configMapGenerator (kustomization.yaml).
#
# Milestone 6: the generated ConfigMap's NAME carries a hash of this file
# (backend-config-<hash>). Changing any value below therefore changes the
# Deployment's pod template, so the change is rolled out like a new image -
# and `kubectl rollout undo` (the pipeline's automatic rollback) brings the
# previous values back together with the previous image.
#
# The DB password is NOT here: DB_PASSWORD_SECRET is the secret's NAME and the
# app reads its value from Secret Manager at start-up.
GCP_PROJECT=gridpulse-509202
# private IP looked up at start-up
CLOUDSQL_INSTANCE=gridpulse-db
DB_NAME=gridpulse
DB_USER=gridpulse
DB_PASSWORD_SECRET=gridpulse-db-password
DB_SSLMODE=require
STORAGE_BACKEND=gcs
GCS_BUCKET=gridpulse-509202-uploads
SEED_DEMO_DATA=false
# Every replica has its own pool: 2 + 1 overflow + 1 for the readiness probe
# = 4 connections per pod. HPA max 4 pods (+1 during a rollout) = 20, under
# the 25-connection limit of Cloud SQL db-f1-micro.
DB_POOL_SIZE=2
DB_MAX_OVERFLOW=1
# At most 4 requests worked on at once per pod; the rest queue briefly.
REQUEST_THREADS=4
# DOMAIN (written by deploy/m5/03_static_ip_and_dns.sh)
CORS_ORIGINS=https://gridpulse-9.duckdns.org
# Milestone 6: JSON logs at INFO, and GET /api/system/simulate-error (a
# controlled HTTP 5xx for the monitoring demo) switched on.
LOG_LEVEL=INFO
ENABLE_ERROR_SIMULATION=true
