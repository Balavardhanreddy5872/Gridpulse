# The backend pods' identity.
#
# Workload Identity maps this Kubernetes service account to the Google service
# account gridpulse-gke-app (created by deploy/m5/02_workload_identity.sh),
# which holds only what the app needs:
#   roles/cloudsql.client                project             look up the private IP
#   roles/secretmanager.secretAccessor   gridpulse-db-password only
#   roles/storage.objectCreator/Viewer   the uploads bucket only
# The pod gets short-lived tokens from the GKE metadata server. No key files.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gridpulse-backend
  namespace: gridpulse
  annotations:
    iam.gke.io/gcp-service-account: gridpulse-gke-app@gridpulse-509202.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/part-of: gridpulse
