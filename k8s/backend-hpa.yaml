# Autoscaler for the backend: 2 to 4 replicas, aiming for 60 % of the
# requested CPU (250m) on average.
#   max 4 keeps total DB connections (4 per pod) under db-f1-micro's limit.
#   scale-up reacts immediately; scale-down waits 60 s (default is 5 min) so
#   the demo can show the count going back down.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: gridpulse
  labels:
    app.kubernetes.io/part-of: gridpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
