# GridPulse - Milestone 4: stateless compute on the VM.
#
#   VM:      docker compose pull && docker compose up -d --no-build
#            -> http://35.184.90.182          (dashboard, same URL as M2/M3)
#            -> http://35.184.90.182:8000/docs
#   Laptop:  ./deploy/build_and_push.sh v2    (builds + pushes these images)
#            docker compose -f docker-compose.local.yml up --build   (local dev)
#
# There is NO database container, NO data volume and NO .env file here.
# Every piece of state lives in a managed Google Cloud service:
#   database  -> Cloud SQL for PostgreSQL 16, private IP only (CLOUDSQL_INSTANCE)
#   uploads   -> Cloud Storage bucket (GCS_BUCKET)
#   secrets   -> Secret Manager (DB_PASSWORD_SECRET is the secret's NAME)
# The backend reaches all three as the VM's service account (gridpulse-vm-sa)
# through the metadata server - no key files. Everything below is plain,
# non-secret configuration, so it is safe to commit.

name: gridpulse

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${REGISTRY:-us-central1-docker.pkg.dev/gridpulse-509202/gridpulse}/gridpulse-backend:${IMAGE_TAG:-v2}
    platform: linux/amd64
    restart: unless-stopped
    # Stateless proof: the container cannot write to its own filesystem at all
    # (only a RAM-backed /tmp for in-flight request buffers).
    read_only: true
    tmpfs:
      - /tmp
    environment:
      GCP_PROJECT: gridpulse-509202
      # Cloud SQL: the backend looks up the instance's PRIVATE IP itself
      CLOUDSQL_INSTANCE: gridpulse-db
      DB_NAME: gridpulse
      DB_USER: gridpulse
      DB_PASSWORD_SECRET: gridpulse-db-password   # the secret's name, not its value
      DB_SSLMODE: require
      # Cloud Storage for uploaded infrastructure PDFs
      STORAGE_BACKEND: gcs
      GCS_BUCKET: gridpulse-509202-uploads
      # Cloud SQL already holds the Milestone 3 data; never seed demo data here
      SEED_DEMO_DATA: "false"
      CORS_ORIGINS: http://localhost,http://127.0.0.1,http://35.184.90.182
    ports:
      - "8000:8000"          # Swagger UI at :8000/docs (allowed only from team IPs by the firewall)
    networks:
      - web-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${REGISTRY:-us-central1-docker.pkg.dev/gridpulse-509202/gridpulse}/gridpulse-frontend:${IMAGE_TAG:-v2}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web-net

networks:
  web-net:    # nginx <-> backend. The database is not on any Docker network:
              # it is Cloud SQL, reached over the VPC's private IP range.
