# nginx config for the GridPulse frontend container.
#  - serves the Vite build (React single-page app)
#  - reverse-proxies /api/* to the backend container over the compose network
#    (on GKE the load balancer sends /api/* straight to the backend Service)
#  - Milestone 6: access log as ONE JSON object per request on stdout, in Cloud
#    Logging's format (severity + httpRequest), like the backend's request log.

# This file is included inside nginx's http {} block, so map/log_format live here.
map $status $gp_severity {
    ~^5     ERROR;
    ~^4     WARNING;
    default INFO;
}
# First address in X-Forwarded-For = the real client (the load balancer appends itself).
map $http_x_forwarded_for $gp_client_ip {
    "~^(?P<first>[^,\s]+)" $first;
    default                $remote_addr;
}
log_format gridpulse_json escape=json
    '{"severity":"$gp_severity","time":"$time_iso8601",'
    '"message":"$request_method $uri -> $status",'
    '"event":"http_request","service":"gridpulse-frontend",'
    '"method":"$request_method","path":"$uri","status_code":$status,'
    '"duration_s":$request_time,'
    '"httpRequest":{"requestMethod":"$request_method","requestUrl":"$request_uri",'
    '"status":$status,"responseSize":"$body_bytes_sent","latency":"${request_time}s",'
    '"userAgent":"$http_user_agent","remoteIp":"$gp_client_ip","protocol":"$server_protocol"}}';

server {
    listen 80;
    server_name _;

    # The official nginx image links this file to the container's stdout.
    access_log /var/log/nginx/access.log gridpulse_json;

    root  /usr/share/nginx/html;
    index index.html;

    # Backend accepts PDFs up to MAX_UPLOAD_MB=10; nginx's default limit is 1 MB.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolve "backend" through Docker's embedded DNS at request time, so nginx
    # keeps working if the backend container is restarted and gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;          # passes the full /api/... URI
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;               # forecast recompute can take a few seconds
    }

    # Container health check endpoint (used by the Dockerfile HEALTHCHECK).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Milestone 6: which release this is (written at build time from
    # APP_VERSION, frontend/Dockerfile); the CI/CD pipeline checks it after a
    # deploy or rollback. Never cached.
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Vite fingerprints files in /assets/, so they can be cached "forever".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router (BrowserRouter): any other path loads the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
