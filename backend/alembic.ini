# Alembic config for GridPulse. Run from backend/ (or /app/backend in the image):
#     alembic upgrade head
# The database URL is NOT stored here - migrations/env.py builds it at run time
# from Secret Manager + the Cloud SQL private IP (or DATABASE_URL locally).

[alembic]
script_location = migrations
file_template = %%(rev)s
prepend_sys_path = .
version_path_separator = os

# Logging is configured in migrations/env.py (JSON lines on stdout, the same
# format as the API - Milestone 6), not here.
