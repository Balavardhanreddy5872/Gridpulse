# Alembic config for GridPulse. Run from backend/ (or /app/backend in the image):
#     alembic upgrade head
# The database URL is NOT stored here - migrations/env.py builds it at run time
# from Secret Manager + the Cloud SQL private IP (or DATABASE_URL locally).

[alembic]
script_location = migrations
file_template = %%(rev)s
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
